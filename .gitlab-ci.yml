stages:
  - build
  - docker
  - deploy
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  APP_NAME: muvbot
  APP_PORT: "8080"
  STACK_NAME: muvbot               # Name des Swarm-Stacks

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE ANCHORS
# ─────────────────────────────────────────────────────────────────────────────
.only_main: &only_main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

.docker_login: &docker_login
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.ssh_setup: &ssh_setup
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: build
# Kompiliert das Spring Boot Projekt und erzeugt den Fat-JAR als CI-Artifact.
# ─────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: eclipse-temurin:17.0.18_8-jdk-alpine
  <<: *only_main
  script:
    - chmod +x gradlew
    - ./gradlew bootJar --no-daemon -x test
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/libs/*.jar
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
# ─────────────────────────────────────────────────────────────────────────────
# STAGE: docker
# Baut das Image mit docker buildx (BuildKit) und pusht beide Tags ins Registry.
# buildx sorgt für besseres Layer-Caching und Multi-Plattform-Support.
# ─────────────────────────────────────────────────────────────────────────────
docker-build:
  stage: docker
  image: docker:29
  services:
    - docker:29-dind
  <<: *docker_login
  <<: *only_main
  script:
    - docker context create myctx
    - docker buildx create --name ci-builder --driver docker-container --use myctx
    - docker buildx inspect --bootstrap
    - |
      docker buildx build \
        --platform linux/amd64 \
        --cache-from type=registry,ref="$IMAGE_TAG_LATEST" \
        --cache-to   type=inline \
        --tag "$IMAGE_TAG" \
        --tag "$IMAGE_TAG_LATEST" \
        --push \
        .
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    # buildx mit --push pusht direkt, kein separater docker push nötig

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: deploy
# SSHt in den Produktionsserver, kopiert die Stack-Datei und führt
# "docker stack deploy" aus. Swarm kümmert sich um Rolling Updates &
# automatischen Rollback bei Fehlern (→ docker-stack.yml).
# ─────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3.23
  retry:
    max: 1
    exit_codes: 1
  <<: *only_main
  <<: *ssh_setup
  script:
    - ssh "$SERVER_USER@$SERVER_IP" "mkdir -p /opt/$STACK_NAME"
    - scp docker-stack.yml "$SERVER_USER@$SERVER_IP:/opt/$STACK_NAME/docker-stack.yml"
    - |
      ssh "$SERVER_USER@$SERVER_IP" /bin/bash << REMOTE
        set -e

        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY" 2>/dev/null || true

        IMAGE_TAG="$IMAGE_TAG" \
        OPENAI_API_KEY="$OPENAI_API_KEY" \
        DB_URL="$DB_URL" \
        DB_USER="$DB_USER" \
        DB_PASS="$DB_PASS" \
        DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" \
        DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
        DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
        DISCORD_REDIRECT_URI="$DISCORD_REDIRECT_URI" \
        CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
          docker stack deploy \
            -c /opt/$STACK_NAME/docker-stack.yml \
            $STACK_NAME \
            --with-registry-auth \
            --prune

        docker service update --force ${STACK_NAME}_muvbot

        docker service ls --filter "name=$STACK_NAME"

        echo "Deploy erfolgreich! Stack: $STACK_NAME"
      REMOTE
  environment:
    name: production
    url: http://$SERVER_IP:$APP_PORT
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: cleanup
# Entfernt ungenutzter Images vom Server (dangling layers etc.).
# Läuft immer, auch wenn deploy fehlschlägt.
# ─────────────────────────────────────────────────────────────────────────────
cleanup:
  stage: cleanup
  image: alpine:3.23
  <<: *only_main
  when: always
  <<: *ssh_setup
  script:
    - |
      ssh "$SERVER_USER@$SERVER_IP" /bin/bash <<REMOTE
        echo "Bereinige ungenutzte Docker Images..."
        docker image prune -af
        echo "Cleanup abgeschlossen."
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: always