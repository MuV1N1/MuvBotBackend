stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  APP_NAME: muvbot
  APP_PORT: 4322

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build --build-arg OPENAI_API_KEY="$OPENAI_API_KEY" --build-arg DB_URL="$DB_URL" --build-arg DB_USER="$DB_USER" --build-arg DB_PASS="$DB_PASS" --build-arg DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" --build-arg DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" --build-arg DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" --build-arg DISCORD_REDIRECT_URI="$DISCORD_REDIRECT_URI" -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

.deploy_template: &deploy_template
  stage: deploy
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y openssh-client sshpass
  script:
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - sshpass -p "$SSH_PASSWORD" ssh $SERVER_USER@$SERVER_IP "docker login -u $DEPLOY_TOKEN_USER -p $DEPLOY_TOKEN_PASSWORD $CI_REGISTRY"
    - sshpass -p "$SSH_PASSWORD" ssh $SERVER_USER@$SERVER_IP "docker pull $IMAGE_TAG"
    - sshpass -p "$SSH_PASSWORD" ssh $SERVER_USER@$SERVER_IP "docker rm -f $APP_NAME || true"
    - sshpass -p "$SSH_PASSWORD" ssh $SERVER_USER@$SERVER_IP "docker run -d --name $APP_NAME -p $APP_PORT:4322 --restart unless-stopped \
      -e DB_URL=\"$DB_URL\" \
      -e DB_USER=\"$DB_USER\" \
      -e DB_PASS=\"$DB_PASS\" \
      -e OPENAI_API_KEY=\"$OPENAI_API_KEY\" \
      -e DISCORD_BOT_TOKEN=\"$DISCORD_BOT_TOKEN\" \
      -e DISCORD_CLIENT_ID=\"$DISCORD_CLIENT_ID\" \
      -e DISCORD_CLIENT_SECRET=\"$DISCORD_CLIENT_SECRET\" \
      -e DISCORD_REDIRECT_URI=\"$DISCORD_REDIRECT_URI\" \
      $IMAGE_TAG"


deploy:
  stage: deploy
  <<: *deploy_template
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    SERVER_IP: $SERVER_IP
    SERVER_USER: $SERVER_USER
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"


