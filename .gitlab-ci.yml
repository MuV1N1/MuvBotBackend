stages:
  - build
  - docker
  - deploy
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  APP_NAME: muvbot
  APP_PORT: "4322"

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE ANCHORS
# ─────────────────────────────────────────────────────────────────────────────
.only_main: &only_main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

.docker_login: &docker_login
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: build
# Compiles the Spring Boot project and produces the fat JAR as a CI artifact.
# ─────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  <<: *only_main
  script:
    - chmod +x gradlew
    - ./gradlew bootJar --no-daemon -x test
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: docker
# Builds the Docker image (using the Dockerfile in the repo root) and pushes
# both a SHA-tagged and a :latest tag to the GitLab Container Registry.
# ─────────────────────────────────────────────────────────────────────────────
docker-build:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  <<: *docker_login
  <<: *only_main
  script:
    - |
      docker build \
        -t "$IMAGE_TAG" \
        -t "$IMAGE_TAG_LATEST" \
        .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_TAG_LATEST"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: deploy
# SSH into the production server, pull the new image and (re)start the
# container.  All secrets come from GitLab CI/CD Variables (Settings → CI/CD).
# ─────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3.19
  <<: *only_main
  before_script:
    # Install SSH client
    - apk add --no-cache openssh-client
    # Set up SSH key from CI variable (add SSH_PRIVATE_KEY in GitLab CI/CD vars)
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_IP" bash -s << 'REMOTE'
        set -e

        # Log in to GitLab registry on the server
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" \
          --password-stdin "${CI_REGISTRY}" 2>/dev/null || true

        # Pull the new image
        docker pull "${IMAGE_TAG}"

        # Stop & remove the old container (ignore errors if it doesn't exist)
        docker stop "${APP_NAME}" 2>/dev/null || true
        docker rm   "${APP_NAME}" 2>/dev/null || true

        # Start the new container
        docker run -d \
          --name "${APP_NAME}" \
          --restart unless-stopped \
          -p "${APP_PORT}:${APP_PORT}" \
          -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
          -e DB_URL="${DB_URL}" \
          -e DB_USER="${DB_USER}" \
          -e DB_PASS="${DB_PASS}" \
          -e DISCORD_BOT_TOKEN="${DISCORD_BOT_TOKEN}" \
          -e DISCORD_CLIENT_ID="${DISCORD_CLIENT_ID}" \
          -e DISCORD_CLIENT_SECRET="${DISCORD_CLIENT_SECRET}" \
          -e DISCORD_REDIRECT_URI="${DISCORD_REDIRECT_URI}" \
          "${IMAGE_TAG}"

        echo "✅ Deployed ${APP_NAME} (${IMAGE_TAG})"
      REMOTE
  environment:
    name: production
    url: http://$SERVER_IP:$APP_PORT

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: cleanup
# Remove dangling / old images from the server to keep disk usage in check.
# Runs even if deploy fails (so stale layers don't pile up).
# ─────────────────────────────────────────────────────────────────────────────
cleanup:
  stage: cleanup
  image: alpine:3.19
  <<: *only_main
  when: always          # run regardless of deploy success/failure
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_IP" bash -s << 'REMOTE'
        echo "🧹 Pruning unused Docker images..."
        docker image prune -f
        echo "✅ Cleanup done"
      REMOTE
