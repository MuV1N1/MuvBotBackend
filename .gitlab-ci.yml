stages:
  - build
  - docker
  - deploy
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  APP_NAME: muvbot
  APP_PORT: "8080"
  STACK_NAME: muvbot               # Name des Swarm-Stacks

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE ANCHORS
# ─────────────────────────────────────────────────────────────────────────────
.only_main: &only_main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

.docker_login: &docker_login
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.ssh_setup: &ssh_setup
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: build
# Kompiliert das Spring Boot Projekt und erzeugt den Fat-JAR als CI-Artifact.
# ─────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  <<: *only_main
  script:
    - chmod +x gradlew
    - ./gradlew bootJar --no-daemon -x test
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: docker
# Baut das Image mit docker buildx (BuildKit) und pusht beide Tags ins Registry.
# buildx sorgt für besseres Layer-Caching und Multi-Plattform-Support.
# ─────────────────────────────────────────────────────────────────────────────
docker-build:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  <<: *docker_login
  <<: *only_main
  script:
    - docker context create myctx
    - docker buildx create --name ci-builder --driver docker-container --use myctx
    - docker buildx inspect --bootstrap
    - |
      docker buildx build \
        --platform linux/amd64 \
        --cache-from type=registry,ref="$IMAGE_TAG_LATEST" \
        --cache-to   type=inline \
        --tag "$IMAGE_TAG" \
        --tag "$IMAGE_TAG_LATEST" \
        --push \
        .
    # buildx mit --push pusht direkt, kein separater docker push nötig

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: deploy
# SSHt in den Produktionsserver, kopiert die Stack-Datei und führt
# "docker stack deploy" aus. Swarm kümmert sich um Rolling Updates &
# automatischen Rollback bei Fehlern (→ docker-stack.yml).
# ─────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3.19
  <<: *only_main
  <<: *ssh_setup
  script:
    # Stack-Datei auf den Server kopieren
    - scp docker-stack.yml "$SERVER_USER@$SERVER_IP:/opt/$STACK_NAME/docker-stack.yml"
    - |
      ssh "$SERVER_USER@$SERVER_IP" /bin/bash <<REMOTE
        set -e

        # ── Login & Image vorab pullen (spart Downtime beim Deploy) ──────────
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY" 2>/dev/null || true
        docker pull "$IMAGE_TAG"

        # ── Stack deployen (oder updaten wenn bereits vorhanden) ─────────────
        export IMAGE_TAG="$IMAGE_TAG"
        export OPENAI_API_KEY="$OPENAI_API_KEY"
        export DB_URL="$DB_URL"
        export DB_USER="$DB_USER"
        export DB_PASS="$DB_PASS"
        export DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN"
        export DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID"
        export DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET"
        export DISCORD_REDIRECT_URI="$DISCORD_REDIRECT_URI"

        docker stack deploy \
          --compose-file /opt/$STACK_NAME/docker-stack.yml \
          --with-registry-auth \
          --prune \
          $STACK_NAME

        docker service update --force --image "$IMAGE_TAG" ${STACK_NAME}_muvbot

        # ── Warten bis der Service healthy ist (max. 90s) ────────────────────
        echo "Warte auf gesunden Service..."
        TIMEOUT=90
        ELAPSED=0
        while [ \$ELAPSED -lt \$TIMEOUT ]; do
          RUNNING=\$(docker service ls --filter name=${STACK_NAME}_muvbot \
            --format "{{.Replicas}}" 2>/dev/null || echo "0/0")
          echo "  [\${ELAPSED}s] Replicas: \$RUNNING"
          # Prüfen ob gewünschte == laufende Replicas (z.B. "1/1")
          WANT=\$(echo \$RUNNING | cut -d'/' -f2)
          HAVE=\$(echo \$RUNNING | cut -d'/' -f1)
          if [ "\$WANT" -gt 0 ] && [ "\$HAVE" = "\$WANT" ]; then
            echo "Service ist healthy! (\$RUNNING)"
            break
          fi
          sleep 10
          ELAPSED=\$((ELAPSED + 10))
        done

        if [ "\$HAVE" != "\$WANT" ] || [ "\$WANT" = "0" ]; then
          echo "FEHLER: Service nicht healthy nach \${TIMEOUT}s. Rollback läuft..."
          docker service rollback ${STACK_NAME}_muvbot || true
          exit 1
        fi

        echo "Deploy erfolgreich! Stack: $STACK_NAME"
      REMOTE
  environment:
    name: production
    url: http://$SERVER_IP:$APP_PORT

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: cleanup
# Entfernt ungenutzter Images vom Server (dangling layers etc.).
# Läuft immer, auch wenn deploy fehlschlägt.
# ─────────────────────────────────────────────────────────────────────────────
cleanup:
  stage: cleanup
  image: alpine:3.19
  <<: *only_main
  when: always
  <<: *ssh_setup
  script:
    - |
      ssh "$SERVER_USER@$SERVER_IP" /bin/bash <<REMOTE
        echo "Bereinige ungenutzte Docker Images..."
        docker image prune -f
        echo "Cleanup abgeschlossen."
      REMOTE
