version: "3.9"

services:
  postgres-db:
    image: postgres:17
    networks:
      - mynet
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
      POSTGRES_DB: defaultdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

  muvbot:
    image: ${IMAGE_TAG}
    networks:
      - mynet
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      DB_URL: "${DB_URL}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  mynet:
    external: true

volumes:
  pgdata:
    external: true
